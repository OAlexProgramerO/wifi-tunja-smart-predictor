name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Compile Python modules
        run: python -m compileall -q api assistant_api app src scripts tests

      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --disable-pip --no-deps

      - name: Generate deterministic synthetic dataset for integration tests
        run: python scripts/generate_synthetic_dataset.py

      - name: Pytest
        run: pytest

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start the full application
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Exercise APIs and dashboard from dashboard network context
        run: docker compose exec -T dashboard python scripts/smoke_test.py

      - name: Verify generated resources persist across shutdown and startup
        run: |
          docker compose down
          docker compose up -d --build --wait --wait-timeout 900
          docker compose logs runtime-init
          docker compose exec -T dashboard python scripts/smoke_test.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services and remove generated CI containers
        if: always()
        run: docker compose down --remove-orphans
