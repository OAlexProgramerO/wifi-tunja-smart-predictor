name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Pytest
        run: pytest

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start the full application
        run: docker compose up -d --build --wait --wait-timeout 900

      - name: Exercise APIs and dashboard from dashboard network context
        run: docker compose exec -T dashboard python scripts/smoke_test.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services and remove generated CI volumes
        if: always()
        run: docker compose down -v --remove-orphans
