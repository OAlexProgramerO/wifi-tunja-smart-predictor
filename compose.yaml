name: wifi-tunja-smart-predictor

x-app: &app
  image: wifi-tunja-smart-predictor:0.5.1
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_VERSION: "0.5.1"
  init: true
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  environment: &app-environment
    RANDOM_SEED: ${RANDOM_SEED:-42}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}

services:
  runtime-init:
    <<: *app
    command: ["python", "scripts/initialize_runtime.py"]
    restart: "no"
    volumes:
      - runtime-data:/app/data
      - runtime-models:/app/models
      - runtime-reports:/app/reports
      - runtime-experiments:/app/experiments
    environment:
      <<: *app-environment
      EXPERIMENT_DB_PATH: /app/experiments/experiments.sqlite3

  main-api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    volumes: &runtime-readonly
      - runtime-data:/app/data:ro
      - runtime-models:/app/models:ro
      - runtime-reports:/app/reports:ro
      - runtime-experiments:/app/experiments:rw
    environment:
      <<: *app-environment
      EXPERIMENT_DB_PATH: /app/experiments/experiments.sqlite3
    ports:
      - "127.0.0.1:${MAIN_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  assistant-api:
    <<: *app
    command: ["uvicorn", "assistant_api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
    volumes:
      - runtime-data:/app/data:ro
      - runtime-models:/app/models:ro
      - runtime-reports:/app/reports:ro
      - runtime-experiments:/app/experiments:ro
    environment:
      <<: *app-environment
      EXPERIMENT_DB_PATH: /app/experiments/experiments.sqlite3
    ports:
      - "127.0.0.1:${ASSISTANT_API_HOST_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  dashboard:
    <<: *app
    command:
      - streamlit
      - run
      - app/dashboard.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    restart: unless-stopped
    depends_on:
      runtime-init:
        condition: service_completed_successfully
      main-api:
        condition: service_healthy
      assistant-api:
        condition: service_healthy
    environment:
      <<: *app-environment
      MAIN_API_URL: ${MAIN_API_URL:-http://main-api:8000}
      ASSISTANT_API_URL: ${ASSISTANT_API_URL:-http://assistant-api:8001}
    volumes:
      - runtime-data:/app/data:ro
      - runtime-models:/app/models:ro
      - runtime-reports:/app/reports:ro
      - runtime-experiments:/app/experiments:ro
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  runtime-data:
  runtime-models:
  runtime-reports:
  runtime-experiments:
